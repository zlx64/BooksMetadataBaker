name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal
        if: hashFiles('**/*.Tests.csproj') != ''

      - name: Publish
        run: dotnet publish BooksMetadataBaker.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ runner.temp }}/publish /p:UseAppHost=false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: ${{ runner.temp }}/publish/
          retention-days: 7

  docker-build:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: books-metadata-baker:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max
